[package]
name = "deno_v8"
version = "0.5.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "V8 facade for Deno"

[lib]
path = "lib.rs"

[features]
# Mirror rusty_v8's feature surface for existing workspace consumers.
default = ["v8"]
v8 = ["dep:rusty_v8"]
simdutf = ["rusty_v8?/simdutf"]
use_custom_libcxx = ["rusty_v8?/use_custom_libcxx"]
v8_enable_pointer_compression = ["rusty_v8?/v8_enable_pointer_compression"]
v8_enable_sandbox = ["rusty_v8?/v8_enable_sandbox"]
v8_enable_v8_checks = ["rusty_v8?/v8_enable_v8_checks"]

[dependencies]
rusty_v8 = { package = "v8", version = "150.4.0", optional = true, default-features = false }
