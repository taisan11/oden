name: Draft Oden Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux-x64:
    name: Build Linux release and create draft
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check tag and select tagged source
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.0" >&2
            exit 1
          fi
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"
      - name: Fetch only the standard library submodule
        run: git submodule update --init --depth=1 tests/util/std
      - name: Install pinned Rust toolchain
        uses: dsherret/rust-toolchain-file@v1
      - name: Build release executable
        run: cargo build --release --locked -p deno --bin oden
      - name: Smoke test the built Oden binary
        run: |
          ./target/release/oden --version
          test "$(./target/release/oden eval 'console.log(1 + 2)')" = "3"
      - name: Package Linux binary
        run: |
          tar -czf oden-x86_64-unknown-linux-gnu.tar.gz -C target/release oden
          sha256sum oden-x86_64-unknown-linux-gnu.tar.gz > oden-x86_64-unknown-linux-gnu.tar.gz.sha256
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            oden-x86_64-unknown-linux-gnu.tar.gz
            oden-x86_64-unknown-linux-gnu.tar.gz.sha256
