name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dsherret/rust-toolchain-file@v1
      - name: Set up Deno (tooling only)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check repository formatting
        run: deno run -A --no-config npm:dprint@0.47.2 check --config=.dprint.json

  lint-js:
    name: JavaScript and TypeScript lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno (tooling only)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run repository lint checks
        run: deno run -A --config=tools/oden.json ./tools/lint.js --js

  cargo-metadata:
    name: Cargo workspace metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dsherret/rust-toolchain-file@v1
      - name: Validate Cargo workspace
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
