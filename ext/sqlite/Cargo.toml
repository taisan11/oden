[package]
name = "oden_sqlite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared Turso backend for node:sqlite and oden:sqlite"

[lib]
path = "lib.rs"

[dependencies]
deno_core.workspace = true
deno_error.workspace = true
deno_permissions.workspace = true
serde.workspace = true
thiserror.workspace = true
turso_core = { version = "=0.8.3", default-features = false, features = ["fs", "json", "time", "uuid", "series"] }
turso_parser = "=0.8.3"
